# Конфигурация для Amvera Cloud (https://amvera.ru).
#
# Нужна только этому хостингу; на VPS или локально файл ни на что не влияет.
# Всё остальное — образ, зависимости, команда запуска — описано в Dockerfile.

meta:
  # Собираем из Dockerfile, а не встроенным сборщиком Python: так версия
  # интерпретатора и набор пакетов одинаковы локально, здесь и на любом
  # другом хостинге, куда проект потом переедет.
  #
  # Оба поля обязательны вместе: environment без toolchain платформа считает
  # ошибкой в секции meta и отказывается собирать проект.
  environment: docker
  toolchain:
    name: docker

build:
  dockerfile: Dockerfile

run:
  # Порт, который слушает приложение внутри контейнера. Должен совпадать с
  # WEBAPP_PORT из Dockerfile, иначе платформа будет стучаться в закрытую дверь.
  containerPort: 8080

  # Постоянное хранилище. Единственная папка, которая переживает пересборку, —
  # сюда смотрит DB_PATH. Всё остальное содержимое контейнера при каждом
  # деплое создаётся заново из образа.
  persistenceMount: /data
